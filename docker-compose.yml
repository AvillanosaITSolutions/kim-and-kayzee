services:
  postgres:
    image: postgres:16-alpine
    container_name: kim-and-kayzee-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: wedding
      POSTGRES_PASSWORD: wedding
      POSTGRES_DB: wedding
    ports:
      # Host 5433 -> container 5432 (5432 is often taken by another local Postgres)
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wedding -d wedding"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
