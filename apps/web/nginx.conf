# Behind the HTTPS front door the hop Traefik -> nginx is plain HTTP, so $scheme is
# "http" here and forwarding it would tell the API the request arrived insecurely.
# Honour the proxy's X-Forwarded-Proto when present, and fall back to our own scheme
# when nothing is in front (local, direct :8081). Only the two real values are
# accepted, so a client cannot forge the header into something else.
map $http_x_forwarded_proto $forwarded_proto {
  default $scheme;
  "~^https?$" $http_x_forwarded_proto;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Same-origin API: forward /api to the API container so the browser only ever
  # talks to THIS host. The API uses a global "api" prefix, so paths pass through
  # 1:1 (the service name "api" resolves on the compose network; it listens on 3000).
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # SPA deep links (e.g. /i/<slug>) — serve index.html and let React Router handle
  # them. This is what the retired GitHub Pages 404.html hack used to do.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
