name: edge

# The shared HTTPS front door for this VPS. It is its OWN compose project (name:
# edge) so rebuilding any app stack never takes :443 down with it, and it is owned
# by NEITHER app — the auto-checkout-bot stack ships an identical copy. Bringing it
# up is idempotent: whichever app deploys first creates it, the other reuses it.
#
# Terminates TLS on :443 with Let's Encrypt (HTTP-01), 308-redirects http->https,
# and routes to any container that carries traefik.* labels on the "edge" network.
services:
  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=edge"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.le.acme.caserver=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}"
      - "--log.level=INFO"
      - "--accesslog=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - edge

networks:
  edge:
    external: true

volumes:
  letsencrypt:
