packages:
  - "apps/*"

# Approve the dependencies whose install scripts pnpm may run. In current pnpm
# this is `allowBuilds` (a map); the old `onlyBuiltDependencies` list is gone.
# Without it, a clean install fails with ERR_PNPM_IGNORED_BUILDS in CI.
#   - esbuild: links its platform binary; Vite needs it to build the web app.
#   - @nestjs/core: only prints a funding banner, listed so it isn't "ignored".
allowBuilds:
  esbuild: true
  "@nestjs/core": true

# Skip the implicit `pnpm install` before every `pnpm run` script.
verifyDepsBeforeRun: false
