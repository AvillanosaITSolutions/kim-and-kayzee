# Render blueprint for the NestJS API. The database lives on Supabase; this
# declares only the API service. It auto-deploys on every push to `main`
# once connected — do this ONCE:
#   Render dashboard → "New +" → "Blueprint" → pick this repo → Apply.
#
# Everything below is pre-filled. The ONLY thing you set by hand is the
# DATABASE_URL secret (Render will prompt for it on first apply).
services:
  - type: web
    name: kim-and-kayzee-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    healthCheckPath: /api/guests/stats
    envVars:
      - key: NODE_ENV
        value: production
      # The only secret. Supabase → Project Settings → Database → Connection
      # string → URI (use the pooled connection, port 6543). SSL turns on
      # automatically whenever DATABASE_URL is present.
      - key: DATABASE_URL
        sync: false
      # Pre-filled: the GitHub Pages origin allowed to call this API
      # (scheme + host only, no trailing slash, no path).
      - key: CORS_ORIGIN
        value: https://avillanosaitsolutions.github.io
